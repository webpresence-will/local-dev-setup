services:
  nginx:
    container_name: "nginx"
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/snippets:/etc/nginx/snippets
      - ${SITES_PATH}:/var/www/html
    depends_on:
      - php74
      - php85
      - mysql
      - phpmyadmin

  php74:
    container_name: "php74"
    restart: unless-stopped
    extra_hosts:
      - "localhost:host-gateway"
    build:
      context: "./php"
      args:
        PHP_VERSION: "7.4"
    volumes:
      - ./php/74/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ${SITES_PATH}:/var/www/html

  php85:
    container_name: "php85"
    restart: unless-stopped
    extra_hosts:
      - "localhost:host-gateway"
    build:
      context: "./php"
      args:
        PHP_VERSION: "8.5"
    volumes:
      - ./php/85/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ${SITES_PATH}:/var/www/html

  mysql:
    container_name: "mysql"
    image: mysql:8.4
    restart: unless-stopped
    command: --lower_case_table_names=0

    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"

    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    container_name: "phpmyadmin"
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  mysql_data:
    name: mysql_data