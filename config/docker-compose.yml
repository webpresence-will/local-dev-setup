services:
  nginx:
    container_name: "nginx"
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/snippets:/etc/nginx/snippets
      - ./nginx/certificates:/etc/nginx/certs:ro
      - ${SITES_PATH}:/var/www/html
    depends_on:
      - php74
      - php84
      - php85
      - mysql
      - phpmyadmin
      - cert-init

  step-ca:
    image: smallstep/step-ca:latest
    container_name: step-ca
    restart: unless-stopped
    environment:
    - DOCKER_STEPCA_INIT_NAME=Local Docker CA
    - DOCKER_STEPCA_INIT_DNS_NAMES=step-ca,localhost
    - DOCKER_STEPCA_INIT_PASSWORD=change-me-strong-password
    - DOCKER_STEPCA_INIT_ACME=true
    volumes:
    - ./step_ca_data:/home/step
    ports:
    - "9000:9000"

  cert-init:
    image: smallstep/step-cli:latest
    container_name: cert-init
    depends_on:
    - step-ca
    volumes:
    - ./step_ca_data:/step-ca:ro
    - ./nginx/certificates:/certs
    entrypoint: /bin/sh
    command: -c "step ca bootstrap --ca-url https://step-ca:9000 --fingerprint "$$(step certificate fingerprint /step-ca/certs/root_ca.crt)" --install=false --context local && step ca certificate gas-care.test /certs/gas-care.test.crt /certs/gas-care.test.key --ca-url https://step-ca:9000 --root /step-ca/certs/root_ca.crt --provisioner admin --provisioner-password-file /step-ca/secrets/password && cp /step-ca/certs/root_ca.crt /certs/local-root-ca.crt"

  php74:
    container_name: "php74"
    restart: unless-stopped
    extra_hosts:
      - "localhost:host-gateway"
    build:
      context: "./php"
      args:
        PHP_VERSION: "7.4"
    volumes:
      - ./php/74/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ${SITES_PATH}:/var/www/html
      - ${COMPOSER_AUTH_PATH}:/home/developer/.composer/auth.json:ro

  php84:
    container_name: "php84"
    restart: unless-stopped
    extra_hosts:
      - "localhost:host-gateway"
    build:
      context: "./php"
      args:
        PHP_VERSION: "8.4"
    volumes:
      - ./php/84/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ${SITES_PATH}:/var/www/html
      - /Users/will/Projects/quizengine:/var/www/html/gas-care/wp-content/plugins/quizengine
      - ${COMPOSER_AUTH_PATH}:/home/developer/.composer/auth.json:ro

  php85:
    container_name: "php85"
    restart: unless-stopped
    extra_hosts:
      - "localhost:host-gateway"
    build:
      context: "./php"
      args:
        PHP_VERSION: "8.5"
    volumes:
      - ./php/85/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ${SITES_PATH}:/var/www/html
      - ${COMPOSER_AUTH_PATH}:/home/developer/.composer/auth.json:ro

  mysql:
    container_name: "mysql"
    image: mysql:8.4
    restart: unless-stopped
    command: --lower_case_table_names=0

    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"

    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    container_name: "phpmyadmin"
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    depends_on:
      - mysql

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  mysql_data:
    name: mysql_data